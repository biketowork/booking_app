<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zakazivanje Termina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard-container">
    
    <!-- LEVA STRANA: Forma za zakazivanje -->
    <div class="card booking-section">
      <h2>Zakaži Termin</h2>
      
      <form id="bookingForm">
        <div class="form-group">
          <label for="name">Ime i Prezime</label>
          <input type="text" id="name" placeholder="Unesite ime i prezime" required>
        </div>

        <div class="form-group">
          <label for="service">Usluga</label>
          <input type="text" id="service" placeholder="Npr. Šišanje, Masaža..." required>
        </div>

        <div class="form-group">
          <label for="worker">Radnik</label>
          <select id="worker">
            <option value="Uros">Uroš</option>
            <option value="Marko">Marko</option>
            <option value="Ana">Ana</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date">Datum</label>
          <input type="date" id="date" required>
        </div>

        <div class="form-group">
          <label for="time">Vreme</label>
          <input type="time" id="time" required>
        </div>

        <button type="submit" id="btnPotvrdi">Potvrdi i Zakaži</button>
      </form>

      <div id="poruka"></div>
    </div>

    <!-- DESNA STRANA: Raspored i lista termina -->
    <div class="card schedule-section">
      <h2>Zakazani Termini</h2>
      
      <div class="appointments-list" id="appointmentsList">
        <p class="empty-msg" style="color: var(--text-muted);">Trenutno nema zakazanih termina.</p>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
