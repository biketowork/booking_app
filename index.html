<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zakazivanje Termina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- LEVA STRANA: Forma za zakazivanje -->
    <div class="left-column">
      <h2>Zakažite Termin</h2>
      <form id="bookingForm">
        <div class="form-group">
          <label for="name">Ime i Prezime</label>
          <input type="text" id="name" placeholder="Unesite ime i prezime" required>
        </div>

        <div class="form-group">
          <label for="service">Usluga</label>
          <input type="text" id="service" placeholder="Npr. Pregled, Konsultacija..." required>
        </div>

        <div class="form-group">
          <label for="date">Datum</label>
          <input type="date" id="date" required>
        </div>

        <div class="form-group">
          <label for="time">Vreme</label>
          <input type="time" id="time" required>
        </div>

        <button type="submit" id="submitBtn">Potvrdi i Zakaži</button>
      </form>
    </div>

    <!-- DESNA STRANA: Prikaz zakazanih termina -->
    <div class="right-column">
      <h2>Zakazani Termini</h2>
      <div id="appointmentsList">
        <p class="empty-msg">Trenutno nema zakazanih termina.</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
